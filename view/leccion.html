<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lecciones de Ruta Segura">
  <title>Lección | Ruta Segura</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-[#F4F6F3] font-sans text-[#172026]">
  <div class="grid min-h-screen lg:grid-cols-[15rem_minmax(0,1fr)]">

    <aside class="flex flex-col bg-[#101417] p-[1.25rem] text-[#FFFFFF] lg:sticky lg:top-0 lg:h-screen">
      <a href="./inicio.html" class="mb-[2rem] flex items-center gap-[0.75rem]">
        <span class="flex gap-[0.18rem] rounded-[0.55rem] bg-[#090C0E] p-[0.4rem]">
          <span class="size-[0.5rem] rounded-full bg-[#D9363E]"></span>
          <span class="size-[0.5rem] rounded-full bg-[#F5C518]"></span>
          <span class="size-[0.5rem] rounded-full bg-[#168653]"></span>
        </span>
        <span class="font-extrabold">Ruta Segura</span>
      </a>

      <nav class="grid gap-[0.5rem]">
        <a href="./inicio.html" class="rounded-[0.65rem] px-[1rem] py-[0.8rem] font-semibold text-[#CBD2D5] hover:bg-[#252D32]">
          ⌂ Inicio
        </a>

        <a href="./principal.html" class="rounded-[0.65rem] bg-[#168653] px-[1rem] py-[0.8rem] font-bold">
          ◆ Mi ruta
        </a>

        <button disabled class="rounded-[0.65rem] px-[1rem] py-[0.8rem] text-left font-semibold text-[#CBD2D5]">
          ▦ Módulos
        </button>

        <button disabled class="rounded-[0.65rem] px-[1rem] py-[0.8rem] text-left font-semibold text-[#CBD2D5]">
          ★ Logros
        </button>
      </nav>

      <a href="./principal.html" class="mt-[1.5rem] rounded-[0.65rem] border-[0.0625rem] border-[#8A959A] px-[1rem] py-[0.75rem] text-center text-[0.78rem] font-bold text-[#CBD2D5] lg:mt-auto">
        Salir de la lección
      </a>
    </aside>

    <main class="p-[1rem] sm:p-[1.5rem] xl:p-[2rem]">
      <div class="mx-auto max-w-[52rem]">

        <header class="rounded-[1rem] bg-[#151A1E] p-[1.5rem] text-[#FFFFFF] shadow-lg sm:p-[2rem]">
          <div class="flex flex-col gap-[1rem] sm:flex-row sm:items-center sm:justify-between">
            <div>
              <p id="module-name" class="text-[0.72rem] font-extrabold uppercase tracking-[0.12em] text-[#F5C518]">
                Módulo
              </p>

              <h1 id="lesson-title" class="mt-[0.4rem] text-[1.8rem] font-extrabold">
                Cargando lección...
              </h1>

              <p id="lesson-description" class="mt-[0.5rem] text-[0.85rem] text-[#CBD2D5]"></p>
            </div>

            <div class="rounded-[0.8rem] bg-[#252D32] p-[1rem]">
              <p class="text-[0.7rem] font-bold uppercase text-[#CBD2D5]">
                Vidas
              </p>

              <div id="lives" class="mt-[0.35rem] flex gap-[0.25rem]" aria-label="Vidas disponibles"></div>
            </div>
          </div>

          <div class="mt-[1.3rem] flex items-center justify-between text-[0.75rem] font-bold">
            <span id="question-progress">Pregunta 0 de 0</span>
            <span id="progress-percent">0%</span>
          </div>

          <div class="mt-[0.5rem] h-[0.55rem] overflow-hidden rounded-full bg-[#68747B]">
            <div id="progress-bar" class="h-full rounded-full bg-[#168653] transition-all duration-500" style="width:0%"></div>
          </div>
        </header>

        <section id="lesson-content" class="mt-[1rem] rounded-[1rem] bg-[#FFFFFF] p-[1.5rem] shadow-lg sm:p-[2rem]">
          <p id="question-number" class="text-[0.72rem] font-extrabold uppercase text-[#168653]"></p>

          <h2 id="question-statement" class="mt-[0.45rem] text-[1.25rem] font-extrabold"></h2>

          <div id="answers" class="mt-[1.3rem] grid gap-[0.75rem]"></div>

          <div id="feedback" class="mt-[1rem] hidden rounded-[0.7rem] p-[1rem]" role="alert">
            <h3 id="feedback-title" class="font-extrabold"></h3>
            <p id="feedback-text" class="mt-[0.35rem] text-[0.82rem]"></p>
          </div>

          <div class="mt-[1.3rem] flex justify-end">
            <button id="next-button" type="button" class="hidden rounded-[0.65rem] bg-[#168653] px-[1.2rem] py-[0.75rem] font-extrabold text-[#FFFFFF] hover:bg-[#0F6840]">
              Siguiente pregunta →
            </button>
          </div>
        </section>

        <section id="result-view" class="mt-[1rem] hidden rounded-[1rem] bg-[#FFFFFF] p-[2rem] text-center shadow-lg">
          <div id="result-icon" class="mx-auto grid size-[4rem] place-items-center rounded-full text-[2rem] font-extrabold"></div>

          <h2 id="result-title" class="mt-[1rem] text-[1.6rem] font-extrabold"></h2>

          <p id="result-text" class="mt-[0.5rem] text-[#68747B]"></p>

          <a href="./principal.html" class="mt-[1.3rem] inline-block rounded-[0.65rem] bg-[#168653] px-[1.3rem] py-[0.8rem] font-extrabold text-[#FFFFFF] hover:bg-[#0F6840]">
            Regresar a mi ruta
          </a>
        </section>

        <section id="error-view" class="mt-[1rem] hidden rounded-[1rem] bg-[#FDE8E9] p-[1.5rem] text-[#A9242B]">
          <h2 class="font-extrabold">No se pudo cargar la lección</h2>
          <p id="error-text" class="mt-[0.4rem] text-[0.82rem]"></p>
        </section>
      </div>
    </main>
  </div>

  <script src="../scripts/leccion.js" defer></script>
</body>
</html>
